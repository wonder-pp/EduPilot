name: 功能建议
description: 提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能想解决什么问题？
      placeholder: 例如：学生提问时无法上传图片作为补充信息
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 你期望怎么实现？
      placeholder: 例如：在问答输入框旁增加图片上传按钮，图片传到 media/ 目录
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有其他实现方式？
    validations:
      required: false
