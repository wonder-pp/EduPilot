# EduPilot 极简部署：直连云端 LLM API（DashScope / OpenAI 兼容） + Django 应用
#
# 用法：
#   1. 复制 .env.example 为 .env，填入你的 API Key
#   2. docker compose up -d --build
#
# 首次启动时容器会自动 migrate / collectstatic / 重建 FAISS 索引

services:
  edupilot:
    build: .
    container_name: edupilot-app
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      # Django 生产 settings
      DJANGO_SETTINGS_MODULE: edupilot_project.settings_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7860/').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
